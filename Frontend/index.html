<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Tickets</title>
    <link rel="stylesheet" href="css/style.css">  
</head>
<body>

    <div class="container formulario-seccion">
        <h2>Crear Nuevo Ticket</h2>
        <form id="ticketForm">
            <div class="form-group">
                <label for="titulo">Título del problema</label>
                <input type="text" id="titulo" required placeholder="Ej. Falla en inicio de sesión">
            </div>
            <div class="form-group">
                <label for="descripcion">Descripción detallada</label>
                <textarea id="descripcion" rows="4" required placeholder="Describe lo que sucede..."></textarea>
            </div>
            <div class="form-group">
                <label for="prioridad">Prioridad</label>
                <select id="prioridad">
                    <option value="Baja">Baja</option>
                    <option value="Media">Media</option>
                    <option value="Alta">Alta</option>
                </select>
            </div>
            <button type="submit">Enviar Ticket</button>
        </form>
    </div>

    <div class="container tickets-seccion">
        <h2>Panel de Tickets Activos</h2>
        <div id="listaTickets">
            <p style="color: #777;">No hay tickets registrados en este momento.</p>
        </div>
    </div>

    <script>
        const API_URL = "http://127.0.0.1:8000/tickets";

        // 🛠️ FUNCIÓN 1: Cargar los tickets desde el Backend
        async function cargarTickets() {
            try {
                const respuesta = await fetch(API_URL);
                const tickets = await respuesta.json();
                
                const contenedor = document.getElementById("listaTickets");
                
                // Si no hay tickets, mostramos el mensaje por defecto
                if (tickets.length === 0) {
                    contenedor.innerHTML = '<p style="color: #777;">No hay tickets registrados en este momento.</p>';
                    return;
                }
                
                // Limpiamos el contenedor antes de pintar los nuevos
                contenedor.innerHTML = "";
                
                // Recorremos cada ticket y lo transformamos en HTML dinámico
                tickets.forEach(ticket => {
                    const ticketHTML = `
                        <div class="ticket-card ${ticket.prioridad}">
                            <div style="display: flex; justify-content: space-between; align-items: center;">
                                <strong style="font-size: 18px; color: #333;">#${ticket.id} - ${ticket.titulo}</strong>
                                <span class="badge">${ticket.estado}</span>
                            </div>
                            <p style="color: #666; margin: 10px 0;">${ticket.descripcion}</p>
                            <div style="font-size: 13px; color: #888;">
                                Prioridad: <strong style="color: #333;">${ticket.prioridad}</strong>
                            </div>
                        </div>
                    `;
                    contenedor.innerHTML += ticketHTML;
                });
            } catch (error) {
                console.error("Error al conectar con el backend:", error);
            }
        }

        // 📝 FUNCIÓN 2: Escuchar el formulario y CREAR un ticket nuevo (POST)
        document.getElementById("ticketForm").addEventListener("submit", async (e) => {
            e.preventDefault(); // Evita que la página se recargue

            // Capturamos los valores que el usuario escribió en la pantalla
            const nuevoTicket = {
                titulo: document.getElementById("titulo").value,
                descripcion: document.getElementById("descripcion").value,
                prioridad: document.getElementById("prioridad").value,
                estado: "Pendiente" // Todo ticket arranca aquí
            };

            try {
                // Hacemos la petición POST enviando el JSON a FastAPI
                const respuesta = await fetch(API_URL, {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify(nuevoTicket)
                });

                if (respuesta.ok) {
                    // Si el backend lo guardó con éxito, limpiamos el formulario
                    document.getElementById("ticketForm").reset();
                    // Volvemos a cargar la lista para que aparezca el nuevo ticket al instante
                    cargarTickets();
                }
            } catch (error) {
                console.error("Error al enviar el ticket:", error);
            }
        });

        // 🔄 EJECUCIÓN INICIAL: Cargar los tickets automáticamente al abrir la página
        cargarTickets();
    </script>
</body>
</html>
